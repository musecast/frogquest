# Builds Frog Quest+ for iOS on GitHub's Mac machines and uploads it to TestFlight. No Mac needed.
# Run it from the Actions tab: TestFlight > Run workflow.
#
# Needs three repository secrets (Settings > Secrets and variables > Actions), from an
# App Store Connect API key with Admin access (Users and Access > Integrations > App Store Connect API):
#   ASC_KEY_ID       the key's Key ID
#   ASC_ISSUER_ID    the Issuer ID shown above the keys list
#   ASC_PRIVATE_KEY  the whole AuthKey_XXXX.p8 file, BEGIN/END lines included
#
# The version (1.1) comes from the iOS export preset. The build number is one above the highest build already
# in App Store Connect (and at least 2 + this workflow's run number), so every run uploads a new, higher build.
#
# Built with Xcode 27.1: only apps linked against the iOS 27.1 SDK use the whole inner display on iPhone Duo
# (older SDKs run in a smaller window, or leave a strip by the status bar).

name: TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight

jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.7.1"
      XCODE_APP: /Applications/Xcode_27.1.app
      PROJECT: Frog Quest FOREVER
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Xcode 27.1
        run: |
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Check the App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_PRIVATE_KEY" ] || missing="$missing ASC_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first:$missing"
            exit 1
          fi
          # Writes the .p8 to $ASC_KEY_PATH, signs in to App Store Connect with it, and sets BUILD.
          python3 tools/ci/check_asc_key.py

      - name: Cache Godot and its iOS template
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-macos-ios

      - name: Get Godot ${{ env.GODOT_VERSION }} and the iOS export template
        run: |
          mkdir -p ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          if [ ! -d ~/godot/Godot.app ]; then
            curl -sSfL -o ~/godot/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
            unzip -q ~/godot/godot.zip -d ~/godot
            rm ~/godot/godot.zip
          fi
          if [ ! -f ~/godot/ios.zip ]; then
            python3 tools/ci/fetch_zip_member.py "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" templates/ios.zip ~/godot/ios.zip
          fi
          templates="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          cp ~/godot/ios.zip "$templates/ios.zip"
          printf '%s.stable' "$GODOT_VERSION" > "$templates/version.txt"
          echo "GODOT=$HOME/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Import the project
        run: '"$GODOT" --headless --path . --import'

      - name: Export the Xcode project
        run: |
          out="$RUNNER_TEMP/xcode"
          mkdir -p "$out"
          "$GODOT" --headless --path . --export-release "iOS" "$out/$PROJECT.xcodeproj"
          "$GODOT" --headless --path . --script res://tools/ci/patch_admob_pbxproj.gd -- "$out/$PROJECT.xcodeproj/project.pbxproj"
          version=$(grep -m1 -o 'MARKETING_VERSION = [^;]*' "$out/$PROJECT.xcodeproj/project.pbxproj" | cut -d' ' -f3)
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: ${{ runner.temp }}/xcode
        run: |
          echo "Frog Quest+ $VERSION ($BUILD)"
          xcodebuild -version
          # Unsigned here; "Sign the app" signs it for the App Store.
          xcodebuild archive -quiet \
            -project "$PROJECT.xcodeproj" \
            -scheme "$PROJECT" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/FrogQuest.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO

      # Xcode's own App Store Connect sign-in rejects API keys here ("Cannot verify client's JWT headers"),
      # so the certificate and profile come straight from the App Store Connect API and Xcode signs offline.
      - name: Get a signing certificate and profile
        run: python3 tools/ci/asc_signing.py setup

      - name: Sign the app
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>ABNG89SP95</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.muse.frogquest</key><string>$PROFILE_UUID</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FrogQuest.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ipa=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          ls -la "$ipa"
          echo "IPA=$ipa" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        run: |
          key_id=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          issuer_id=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          # altool looks for AuthKey_<key id>.p8 in a few fixed folders.
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/
          # --upload-app is the deprecated form; --upload-package is the newer one, in case a new Xcode drops the old.
          if ! xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$key_id" --apiIssuer "$issuer_id"; then
            echo "::warning::altool --upload-app failed; trying --upload-package"
            xcrun altool --upload-package "$IPA" --type ios --apple-id "$APP_APPLE_ID" \
              --bundle-id com.muse.frogquest --bundle-version "$BUILD" --bundle-short-version-string "$VERSION" \
              --apiKey "$key_id" --apiIssuer "$issuer_id"
          fi
          echo "UPLOADED=1" >> "$GITHUB_ENV"

      - name: Clean up signing
        if: always()
        run: |
          [ -z "$ASC_KEY_PATH" ] || python3 tools/ci/asc_signing.py cleanup || true
          rm -rf "$RUNNER_TEMP/private_keys" ~/.appstoreconnect/private_keys "$RUNNER_TEMP/signing"

      - name: Summary
        run: |
          echo "### Frog Quest+ $VERSION ($BUILD) uploaded to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "Apple takes 5 to 30 minutes to process it; then it shows up in App Store Connect > TestFlight and in the TestFlight app." >> "$GITHUB_STEP_SUMMARY"
